# Tendril's own checks. Upstream Pumpkin's workflows stay untouched next to this file.
name: Tendril

on:
  # Every branch, so milestone branches are checked before they reach main. bench/* branches
  # only exist to start the Bench workflow on a commit CI already checked.
  push:
    branches-ignore: ["bench/**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Same override upstream CI uses for non-release builds: fat LTO takes too long per target.
  CARGO_PROFILE_RELEASE_LTO: "off"

jobs:
  launcher:
    name: Launcher fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: launcher
      - run: cargo fmt -p tendril-launcher -p tendril-setup --check
      - run: cargo clippy --locked -p tendril-launcher -p tendril-setup --all-targets
      - run: cargo test --locked -p tendril-setup -p tendril-launcher

  pumpkin-changes:
    # Upstream crates Tendril patches: their own strict clippy and the tests next to our changes.
    name: Pumpkin crates we change
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable && rustup component add clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: pumpkin-changes
      - run: cargo clippy --locked -p pumpkin-core -p pumpkin-config --all-targets --all-features
      - run: cargo test --locked -p pumpkin-core --lib -- server::ticker net::bedrock::login
      - run: cargo test --locked -p pumpkin-config

  first-run:
    # M1 gate: an empty folder becomes a joinable server with one command.
    name: First run on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
          - name: Linux x86_64 musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: Linux aarch64
            os: ubuntu-26.04-arm
          - name: Linux aarch64 musl
            os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
          - name: Windows x86_64
            os: windows-latest
          - name: macOS arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - name: Add musl target
        if: matrix.target
        run: |
          rustup target add ${{ matrix.target }}
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: first-run-${{ matrix.name }}
      - name: Build
        shell: bash
        run: cargo build --locked --release -p tendril-launcher ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - name: Empty folder to joined bot
        shell: bash
        run: |
          DIR="target/release"
          if [ -n "${{ matrix.target }}" ]; then DIR="target/${{ matrix.target }}/release"; fi
          EXT=""
          if [ "${{ runner.os }}" == "Windows" ]; then EXT=".exe"; fi
          PY=$(command -v python3 || command -v python)
          "$PY" bench/first_run_test.py "$DIR/tendril$EXT"
      - name: Bench smoke test
        shell: bash
        run: |
          DIR="target/release"
          if [ -n "${{ matrix.target }}" ]; then DIR="target/${{ matrix.target }}/release"; fi
          EXT=""
          if [ "${{ runner.os }}" == "Windows" ]; then EXT=".exe"; fi
          "$DIR/tendril$EXT" bench --quick --json bench-quick.json

  macos-x86_64:
    # No x86_64 macOS runner in upstream's matrix either; cross-compile and build only.
    name: Build macOS x86_64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable && rustup target add x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-x86_64
      - run: cargo build --locked --release -p tendril-launcher --target x86_64-apple-darwin

  android:
    # Built like upstream's Android job. The first-run test runs on a real phone, not here.
    name: Build Android aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable && rustup target add aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - run: cargo install cargo-ndk
      # API 24 is Termux's minimum (Android 7) and the first with getifaddrs, which sysinfo 0.40 links.
      - run: cargo ndk -t arm64-v8a --platform 24 build --locked --release -p tendril-launcher
      - uses: actions/upload-artifact@v7
        with:
          name: tendril-aarch64-android
          path: target/aarch64-linux-android/release/tendril
