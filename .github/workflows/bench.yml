# Section 14 benchmarks with the binaries we would ship: upstream's release profile (fat LTO)
# and stripped symbols. Compares glibc malloc arena caps (section 10); mimalloc lost on RSS
# everywhere (D-025).
name: Bench

on:
  # Push any ref to bench/<name> to benchmark it; dispatch and schedule only run from the
  # default branch.
  push:
    branches: ["bench/**"]
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * *"

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_STRIP: symbols

jobs:
  bench:
    name: Bench ${{ matrix.name }} (arenas ${{ matrix.arenas }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm]
        # tendril = the launcher's own cap (4 on these 4-core runners); 32 = glibc's default.
        arenas: [tendril, "2", "32"]
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: ubuntu-26.04-arm
            name: linux-aarch64
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench-${{ matrix.name }}
      - name: Build with the release profile
        run: cargo build --locked --release -p tendril-launcher
      - name: Bench (3 runs)
        shell: bash
        run: |
          if [ "${{ matrix.arenas }}" != tendril ]; then export MALLOC_ARENA_MAX=${{ matrix.arenas }}; fi
          target/release/tendril bench --json bench-${{ matrix.name }}-arenas-${{ matrix.arenas }}.json
      - uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.name }}-arenas-${{ matrix.arenas }}
          path: bench-${{ matrix.name }}-arenas-${{ matrix.arenas }}.json

  android:
    # Same profile for the phone; the phone runs `tendril bench` itself.
    name: Android release build
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable && rustup target add aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench-android
      - run: cargo install cargo-ndk
      - run: cargo ndk -t arm64-v8a --platform 24 build --locked --release -p tendril-launcher
      - uses: actions/upload-artifact@v7
        with:
          name: tendril-aarch64-android-release
          path: target/aarch64-linux-android/release/tendril

  formats:
    # Section 10: pick the default world format from data. Anvil is in the bench job above.
    name: Bench linux-x86_64 (format ${{ matrix.format }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        format: [linear, pump]
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench-linux-x86_64
      - name: Build with the release profile
        run: cargo build --locked --release -p tendril-launcher
      - name: Bench (3 runs)
        run: target/release/tendril bench --format ${{ matrix.format }} --json bench-linux-x86_64-format-${{ matrix.format }}.json
      - uses: actions/upload-artifact@v7
        with:
          name: bench-linux-x86_64-format-${{ matrix.format }}
          path: bench-linux-x86_64-format-${{ matrix.format }}.json

  view-distance:
    # Section 4: memory per player at view distance 6, 8 and 10. 8 is the desktop default above.
    name: Bench linux-x86_64 (view distance ${{ matrix.view }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        view: [6, 10]
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench-linux-x86_64
      - name: Build with the release profile
        run: cargo build --locked --release -p tendril-launcher
      - name: Bench (3 runs)
        run: target/release/tendril bench --view-distance ${{ matrix.view }} --json bench-linux-x86_64-view-${{ matrix.view }}.json
      - uses: actions/upload-artifact@v7
        with:
          name: bench-linux-x86_64-view-${{ matrix.view }}
          path: bench-linux-x86_64-view-${{ matrix.view }}.json
